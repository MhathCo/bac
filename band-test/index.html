:root{
  --pink:#ff2e88; --lemon:#fff35c; --lime:#a6ff3b; --orange:#ff8a1f;
  /* names the script also uses */
  --bg:#000; --panel:#000; --panel2:#0a0a0a; --gold:var(--lemon); --gold2:var(--lemon);
  --cream:#fff; --dim:#8c8c8c; --line:#fff; --no:#fff;
  --reh:var(--lemon); --gig:var(--pink); --other:var(--lime);
  --px:"Press Start 2P",monospace; --term:"VT323",monospace; --brand:"Outfit",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#000}
html,body{margin:0;color:#fff;font-family:var(--term);font-size:21px;line-height:1.15}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);background-color:#000;
  background-image:
    radial-gradient(circle at 22px 34px,#fff 1px,transparent 1.6px),
    radial-gradient(circle at 96px 128px,rgba(255,255,255,.55) 1px,transparent 1.6px),
    radial-gradient(circle at 162px 58px,var(--lemon) 1.4px,transparent 2px),
    radial-gradient(circle at 214px 182px,rgba(255,255,255,.7) 1px,transparent 1.6px),
    radial-gradient(circle at 48px 206px,var(--pink) 1.4px,transparent 2px),
    radial-gradient(circle at 132px 222px,var(--lime) 1px,transparent 1.6px);
  background-size:240px 240px}
/* CRT scanlines + vignette */
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
  box-shadow:inset 0 0 140px rgba(0,0,0,.85)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;border-radius:0}
.wrap{position:relative;max-width:760px;margin:0 auto;padding:18px 14px 24px}

/* pixel-notched frames */
.nav,.todaybtn,.primary,section.card,.names button,.choice button,input,textarea,form.add .types button,.evcard,.toast,.close,.del,.badge{
  border:0;box-shadow:0 -3px 0 0 var(--bc,#fff),0 3px 0 0 var(--bc,#fff),-3px 0 0 0 var(--bc,#fff),3px 0 0 0 var(--bc,#fff)}

/* header */
header{text-align:center;padding:10px 0 4px}
.deco{display:flex;align-items:center;justify-content:center;gap:18px}
.deco::before,.deco::after{content:"";display:block;width:3px;height:3px;margin:0 21px 27px 0;flex:none}
.deco::before{box-shadow:9px 0px 0 0 var(--lime),12px 0px 0 0 var(--lime),9px 3px 0 0 var(--lime),15px 3px 0 0 var(--lime),9px 6px 0 0 var(--lime),18px 6px 0 0 var(--lime),9px 9px 0 0 var(--lime),18px 9px 0 0 var(--lime),9px 12px 0 0 var(--lime),15px 12px 0 0 var(--lime),9px 15px 0 0 var(--lime),3px 18px 0 0 var(--lime),6px 18px 0 0 var(--lime),9px 18px 0 0 var(--lime),0px 21px 0 0 var(--lime),3px 21px 0 0 var(--lime),6px 21px 0 0 var(--lime),9px 21px 0 0 var(--lime),0px 24px 0 0 var(--lime),3px 24px 0 0 var(--lime),6px 24px 0 0 var(--lime),9px 24px 0 0 var(--lime),3px 27px 0 0 var(--lime),6px 27px 0 0 var(--lime)}
.deco::after{box-shadow:9px 0px 0 0 var(--pink),12px 0px 0 0 var(--pink),6px 3px 0 0 var(--pink),12px 3px 0 0 var(--pink),3px 6px 0 0 var(--pink),12px 6px 0 0 var(--pink),3px 9px 0 0 var(--pink),12px 9px 0 0 var(--pink),6px 12px 0 0 var(--pink),12px 12px 0 0 var(--pink),12px 15px 0 0 var(--pink),12px 18px 0 0 var(--pink),15px 18px 0 0 var(--pink),18px 18px 0 0 var(--pink),12px 21px 0 0 var(--pink),15px 21px 0 0 var(--pink),18px 21px 0 0 var(--pink),21px 21px 0 0 var(--pink),12px 24px 0 0 var(--pink),15px 24px 0 0 var(--pink),18px 24px 0 0 var(--pink),21px 24px 0 0 var(--pink),15px 27px 0 0 var(--pink),18px 27px 0 0 var(--pink)}
h1{font-family:var(--px);font-weight:400;font-size:28px;margin:0;color:var(--lemon);letter-spacing:0;
  text-shadow:3px 3px 0 var(--pink),6px 6px 0 var(--orange)}
.sub{margin-top:18px;font-family:var(--px);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--pink)}
.sub::before{content:"\25B6  ";animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.who{margin-top:14px;font-size:22px;color:var(--dim)}
.who b{color:var(--lemon);font-weight:400}
.who button{color:var(--lime);text-decoration:underline;margin-left:10px}
.badge{display:inline-block;--bc:var(--pink);background:var(--pink);color:#000;font-family:var(--px);font-size:8px;padding:3px 3px 2px;margin:0 6px 0 12px;vertical-align:3px;text-transform:uppercase}

/* legend */
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:center;margin:14px 0 2px;font-size:21px}
.legend span{display:flex;align-items:center;gap:7px}
.sw{width:12px;height:12px;display:inline-block;flex:none}

/* month bar */
.monthbar{display:flex;align-items:center;justify-content:space-between;margin:20px 3px 12px}
.monthbar h2{font-family:var(--px);font-weight:400;font-size:13px;margin:0;color:#fff;text-transform:uppercase;text-align:center}
.nav{width:42px;height:42px;background:#000;color:var(--lemon);font-family:var(--px);font-size:14px;line-height:1}
.nav:active,.todaybtn:active,.primary:active,.choice button:active,.names button:active{transform:translate(2px,2px)}
.tools{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 3px 10px;font-size:21px}
.toggle{display:flex;align-items:center;gap:10px;color:var(--dim)}
.toggle .pill{width:36px;height:18px;position:relative;background:#000;box-shadow:0 0 0 3px #fff}
.toggle .pill::after{content:"";position:absolute;top:3px;left:3px;width:12px;height:12px;background:var(--dim)}
.toggle.on{color:var(--lime)} .toggle.on .pill::after{left:21px;background:var(--lime)}
.todaybtn{color:#000;background:var(--lime);font-family:var(--px);font-size:9px;padding:8px 9px 7px;text-transform:uppercase}

/* triangle grid: six slices per day (five people + the date) */
.dows{position:relative;height:14px;margin:4px 0 6px}
.dow{position:absolute;top:0;transform:translateX(-50%);font-family:var(--px);font-size:9px;color:var(--lime)}
.tgrid{position:relative;width:100%;touch-action:pan-y}
.day{position:absolute;width:25%;padding:0;background:none;cursor:pointer}
.day.up{clip-path:polygon(50% 0,100% 100%,0 100%)}
.day.dn{clip-path:polygon(0 0,100% 0,50% 100%)}
.day svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;display:block}
.day:active{filter:brightness(1.25)}
.day.past{opacity:.35}
.tnum{font-family:var(--px);text-anchor:middle;dominant-baseline:middle;stroke-width:3px;paint-order:stroke}
.ttag{font-family:var(--px);font-size:6.5px;text-anchor:middle;dominant-baseline:middle;fill:#fff}
/* panels below */
section.card{margin:30px 3px 0;background:#000;padding:14px 14px 10px}
section.card h3{font-family:var(--px);font-weight:400;font-size:11px;color:var(--lemon);margin:0 0 10px;text-transform:uppercase;line-height:1.4}
section.card + section.card h3{color:var(--lime)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-top:2px dashed rgba(255,255,255,.18);cursor:pointer}
.list li:first-child{border-top:0}
.list .d{min-width:100px;color:var(--lime)}
.list .t{flex:1}
.list .m{color:var(--dim);font-size:19px}

<body>
<div class="wrap">
<div style="background:#000;box-shadow:0 0 0 3px var(--lemon);color:var(--lemon);font-size:19px;padding:8px 10px;margin:3px 3px 14px;text-align:center;line-height:1.2">
<span style="font-family:var(--px);font-size:9px">TEST VERSION</span> — saves on this device only.<br>Starting PINs: Math 1111 · Sarah 2222 · Bobs 3333 · Simon 4444 · Mike 5555 (you'll be asked to pick your own)<br>Hidden viewer: tap no name, type 6666 · No real texts or alerts are sent here</div>
  <header>
    <div class="deco"><h1 id="band">80s-ish</h1></div>
    <div class="sub" id="sub">Rehearsal Calendar</div>
    <div class="who" id="who"></div>
  </header>
  <main id="app"></main>
  <footer>MhathCo</footer>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><button class="close" id="closeSheet" aria-label="Close">×</button><div class="inner" id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script>
// DEMO ONLY: stands in for api.php so the page runs with no server.
// Data is saved in this browser only. Same rules as the real api.php (PIN change included).
(function(){
  const BAND='80s-ish', ADMIN='Math';
  const MEMBERS=[
    {name:'Math',color:'#a6ff3b',pin:'1111'},{name:'Sarah',color:'#ff8a1f',pin:'2222'},
    {name:'Bobs',color:'#ff2e88',pin:'3333'},{name:'Simon',color:'#fff35c',pin:'4444'},
    {name:'Mike',color:'#8fd3ff',pin:'5555'}];
  const VIEWERS=[{name:'Guest',pin:'6666'}];
  const K='bac80demo-data', KP='bac80demo-pins', KPH='bac80demo-phones';
  let mem={avail:{},events:[]}, memP={};
  const get=(k,m)=>{ try{ return JSON.parse(localStorage.getItem(k)) || m; }catch(e){ return m; } };
  const put=(k,v)=>{ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };
  const read=()=>get(K,mem), write=d=>{ mem=d; put(K,d); };
  const pins=()=>get(KP,memP), writePins=p=>{ memP=p; put(KP,p); };
  const phones=()=>get(KPH,{}), savePhone=(n,ph)=>{ const a=phones(); a[n]=ph; put(KPH,a); };
  const normPhone=p=>{ p=String(p||'').replace(/[\s\-().]/g,''); if(/^07\d{9}$/.test(p)) return '+44'+p.slice(1); if(/^447\d{9}$/.test(p)) return '+'+p; if(/^\+\d{8,15}$/.test(p)) return p; return null; };
  const reply=n=>({name:n,token:sign(n),admin:n===ADMIN,viewer:false,needPhone:!phones()[n]});
  const pinProblem=(n,p)=>!/^\d{4,8}$/.test(p)?'PIN must be 4 to 8 numbers':MEMBERS.find(m=>m.name===n).pin===p?'Choose a different PIN from the one you were given':(/^(\d)\1+$/.test(p)||'0123456789'.includes(p))?'Too easy to guess — try another':null;
  const ver=n=>pins()[n] ? 'v'+pins()[n].length+pins()[n].slice(-2) : 'default';
  const sign=(n,scope)=>n+'.'+(scope||'full')+'.'+ver(n);
  const nameOf=t=>String(t||'').split('.')[0];
  const isM=n=>MEMBERS.some(m=>m.name===n), isV=n=>VIEWERS.some(v=>v.name===n);
  const full=t=>{ const n=nameOf(t); return (isM(n)||isV(n)) && t===sign(n) ? n : null; };
  const pub=d=>({band:BAND, admin:ADMIN, members:MEMBERS.map(m=>({name:m.name,color:m.color})), avail:d.avail, events:d.events});
  const res=(o,code)=>new Promise(r=>setTimeout(()=>r(new Response(JSON.stringify(o),{status:code||200,headers:{'Content-Type':'application/json'}})),120));
  const okDate=d=>/^\d{4}-\d{2}-\d{2}$/.test(d||'');
  const realFetch=window.fetch.bind(window);
  window.fetch=function(url,opt){
    opt=opt||{};
    if (!String(url).startsWith('api.php')) return realFetch(url,opt);
    const action=new URL(url, location.href).searchParams.get('action');
    let b={}; try{ b=opt.body ? JSON.parse(opt.body) : {}; }catch(e){}
    const hdr=(opt.headers||{})['X-Token'];
    const d=read();
    switch(action){
      case 'members': return res({band:BAND, members:pub(d).members});
      case 'public': return res({band:BAND, admin:'', members:[], avail:{}, events:d.events.filter(e=>e.type==='gig').map(e=>({id:e.id,date:e.date,type:'gig',title:e.title,time:e.time,place:e.place}))});
      case 'state': return full(hdr) ? res(pub(d)) : res({error:'Please log in again'},401);
      case 'login': {
        if (!b.name){ const v=VIEWERS.find(v=>b.pin && v.pin===b.pin); return v ? res({name:v.name,token:sign(v.name),admin:false,viewer:true}) : res({error:'Tap your name first'},401); }
        const m=MEMBERS.find(m=>m.name===b.name); if(!m) return res({error:'Wrong PIN'},401);
        const own=pins()[m.name];
        if (own) return own===b.pin ? res(reply(m.name)) : res({error:'Wrong PIN'},401);
        if (m.pin!==b.pin) return res({error:'Wrong PIN'},401);
        return res({name:m.name,token:sign(m.name,'chg'),mustChange:true,admin:false,viewer:false});
      }
      case 'change_pin': {
        const n=nameOf(b.token); if(!isM(n) || (b.token!==sign(n,'chg') && b.token!==sign(n))) return res({error:'Please log in again'},401);
        const p=String(b.pin||''), e=pinProblem(n,p); if (e) return res({error:e},400);
        if ((b.phone||'').trim() || !phones()[n]){ const ph=normPhone(b.phone); if(!ph) return res({error:'Add your mobile number (e.g. 07700 900123) so you can reset your PIN if you forget it'},400); savePhone(n,ph); }
        const all=pins(); all[n]=p; writePins(all);
        return res(reply(n));
      }
      case 'set_phone': {
        const n=nameOf(b.token); if(!isM(n) || b.token!==sign(n)) return res({error:'Please log in again'},401);
        const ph=normPhone(b.phone); if(!ph) return res({error:"That doesn't look like a mobile number"},400);
        savePhone(n,ph); return res(reply(n));
      }
      case 'forgot_pin': {
        const ph=normPhone(b.phone);
        if (isM(b.name) && ph && phones()[b.name]===ph) return res({ok:true, demoLink:'?reset=demo-'+encodeURIComponent(b.name)+'-'+Date.now()});
        return res({ok:true});
      }
      case 'reset_pin': {
        const m=/^demo-(.+)-(\d+)$/.exec(String(b.reset||'')); const n=m && decodeURIComponent(m[1]);
        if (!m || !isM(n) || Date.now()-(+m[2])>900000) return res({error:'This reset link has expired. Ask for a new one from "Forgot PIN?"'},410);
        const e=pinProblem(n,String(b.pin||'')); if (e) return res({error:e},400);
        const all=pins(); all[n]=String(b.pin); writePins(all); return res(reply(n));
      }
      case 'push_key': case 'push_sub': case 'push_test':
        return res({error:'Alerts only work once it\'s on the real server'},400);
      case 'avail': {
        const n=nameOf(b.token); if(!isM(n) || b.token!==sign(n)) return res({error:'Please log in again'},401);
        if(!okDate(b.date)) return res({error:'Bad date'},400);
        if (b.status===null){ if(d.avail[b.date]){ delete d.avail[b.date][n]; if(!Object.keys(d.avail[b.date]).length) delete d.avail[b.date]; } }
        else if (b.status==='y'){ (d.avail[b.date]=d.avail[b.date]||{})[n]='y'; }
        else return res({error:'Bad status'},400);
        write(d); return res(pub(d));
      }
      case 'event_add': case 'event_del': {
        const n=nameOf(b.token); if(!isM(n) || b.token!==sign(n)) return res({error:'Please log in again'},401);
        if (n!==ADMIN) return res({error:'Admin only'},403);
        if (action==='event_del'){ d.events=d.events.filter(e=>e.id!==b.id); write(d); return res(pub(d)); }
        const e=b.event||{}; if(!okDate(e.date)) return res({error:'Bad date'},400);
        const cut=(s,n)=>String(s||'').trim().slice(0,n);
        d.events.push({id:Date.now().toString(16)+Math.random().toString(16).slice(2,6), date:e.date,
          type:['rehearsal','gig','other'].includes(e.type)?e.type:'other',
          title:cut(e.title,80), time:cut(e.time,20), place:cut(e.place,80), notes:cut(e.notes,400)});
        write(d); return res(pub(d));
      }
      default: return res({error:'Unknown action'},404);
    }
  };
})();

</script>
<script>
const API = 'api.php';
const TYPES = {rehearsal:'Rehearsal', gig:'Gig', other:'Other'};
const SHORT = {rehearsal:'<span class="lg">Rehearsal</span><span class="sm">Reh</span>', gig:'Gig', other:'Note'};
let S = {members:[], avail:{}, events:[], band:'80s-ish', admin:''};
let me = store('bac80');             // {name, token, admin, viewer}
let viewOnly = false;
let resetTok = new URLSearchParams(location.search).get('reset');   // from a "Forgot PIN" text                // public "Just looking": gigs only
let view = new Date(); view.setDate(1);
let quick = true;                    // Quick mark is on when the app opens
let openKey = null;
let newType = 'rehearsal';

/* ---------- helpers ---------- */
function store(k, v){
  try{
    if (v === undefined) return JSON.parse(localStorage.getItem(k) || 'null');
    if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v));
  }catch(e){ return null; }
}
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const todayKey = () => ymd(new Date());
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtLong = k => parse(k).toLocaleDateString('en-GB',{weekday:'long', day:'numeric', month:'long', year:'numeric'});
const fmtShort = k => parse(k).toLocaleDateString('en-GB',{weekday:'short', day:'numeric', month:'short'});
const eventsOn = k => S.events.filter(e => e.date === k).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
const allFree = k => { const a = S.avail[k] || {}; return S.members.length && S.members.every(m => a[m.name] === 'y'); };
const isAdmin = () => me && !me.viewer && me.name === S.admin;
const canMark = () => me && !me.viewer;

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }

async function api(action, body){
  const headers = me ? {'X-Token': me.token} : {};
  const opt = body ? {method:'POST', headers:{...headers,'Content-Type':'application/json'}, body:JSON.stringify(body)} : {headers};
  const r = await fetch(`${API}?action=${action}&_=${Date.now()}`, opt);
  let j; try{ j = await r.json(); }catch(e){ throw new Error('Server error'); }
  if (r.status === 401 && action !== 'login'){ logout(); throw new Error('Please log in again'); }
  if (!r.ok || j.error) throw new Error(j.error || 'Something went wrong');
  return j;
}

async function load(){
  try{
    if (!me && viewOnly){ S = await api('public'); render(); if (openKey) openDay(openKey, true); return; }
    if (resetTok || (me && me.mustChange)){
      if (!S.members.length){ const p = await api('members'); S.members = p.members; S.band = p.band; }
      return render();
    }
    if (!me){ const p = await api('members'); S.members = p.members; S.band = p.band; return render(); }
    S = await api('state'); render(); if (openKey) openDay(openKey, true);
  }
  catch(e){ toast(e.message); }
}

/* ---------- login ---------- */
function renderLogin(){
  let pick = null;
  $('#who').innerHTML = '';
  $('#app').innerHTML = `
    <div class="login">
      <div class="label">Select player</div>
      <div class="names">${S.members.map(m=>`<button data-n="${esc(m.name)}"><span class="sw" style="background:${m.color}"></span>${esc(m.name)}</button>`).join('')}</div>
      <input class="pin" id="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="8" placeholder="PIN">
      <button class="primary" id="go" style="width:200px">Start</button>
      <div class="err" id="err"></div>
      <button class="viewonly" id="forgot">Forgot PIN?</button><br>
      <button class="viewonly" id="vo">Just looking — see our gigs</button>
    </div>`;
  document.querySelectorAll('.names button').forEach(b => b.onclick = () => {
    document.querySelectorAll('.names button').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel'); pick = b.dataset.n; $('#pin').focus();
  });
  const go = async () => {
    if (!pick && !$('#pin').value) return $('#err').textContent = 'Tap your name first';
    try{
      me = await api('login', {name:pick || '', pin:$('#pin').value});
      store('bac80', me); viewOnly = false;
      if (me.mustChange || me.needPhone) return render();
      load();
    }catch(e){ $('#err').textContent = e.message; $('#pin').value=''; }
  };
  $('#go').onclick = go;
  $('#pin').onkeydown = e => { if (e.key === 'Enter') go(); };
  $('#vo').onclick = () => { viewOnly = true; load(); };
  $('#forgot').onclick = renderForgot;
}
/* ---------- choose your own PIN (forced on first login) ---------- */
function renderChangePin(forced){
  $('#who').innerHTML = '';
  $('#app').innerHTML = `
    <div class="pinbox">
      <div class="label">${forced ? 'Welcome, ' + esc(me.name) : 'Change PIN'}</div>
      <p>${forced ? 'Choose your own PIN to carry on. 4 to 8 numbers.' : 'Pick a new PIN. 4 to 8 numbers.'}</p>
      <input class="pin" id="np1" type="password" inputmode="numeric" autocomplete="new-password" maxlength="8" placeholder="NEW PIN">
      <input class="pin" id="np2" type="password" inputmode="numeric" autocomplete="new-password" maxlength="8" placeholder="AGAIN">
      ${forced ? `<p style="margin:6px 0 10px">Your mobile number, so you can reset your PIN by text if you forget it.</p>
      <input class="pin tel" id="nph" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="07…">` : ''}
      <button class="primary" id="savepin" style="width:220px">Save PIN</button>
      <div class="err" id="err"></div>
      <button class="viewonly" id="cancelpin">${forced ? 'Log out' : 'Cancel'}</button>
    </div>`;
  const save = async () => {
    const a = $('#np1').value, b = $('#np2').value;
    if (a !== b) { $('#err').textContent = "PINs don't match"; return; }
    try{
      const r = await api('change_pin', {token:me.token, pin:a, phone: $('#nph') ? $('#nph').value : ''});
      me = r; store('bac80', me); toast('PIN saved'); load();
    }catch(e){ $('#err').textContent = e.message; }
  };
  $('#savepin').onclick = save;
  $('#np2').onkeydown = e => { if (e.key === 'Enter' && !$('#nph')) save(); };
  $('#cancelpin').onclick = () => forced ? logout() : render();
  $('#np1').focus();
}

/* ---------- mobile number (needed for PIN reset by text) ---------- */
function renderPhone(forced){
  $('#who').innerHTML = '';
  $('#app').innerHTML = `
    <div class="pinbox">
      <div class="label">${forced ? 'One more thing' : 'Mobile number'}</div>
      <p>${forced ? 'Add your mobile number, so you can reset your PIN by text if you forget it.' : 'Change the number your PIN reset texts go to.'}</p>
      <input class="pin tel" id="ph" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="07…">
      <button class="primary" id="saveph" style="width:220px">Save number</button>
      <div class="err" id="err"></div>
      <button class="viewonly" id="cancelph">${forced ? 'Log out' : 'Cancel'}</button>
    </div>`;
  const save = async () => {
    try{ const r = await api('set_phone', {token:me.token, phone:$('#ph').value}); me = {...me, needPhone:false}; store('bac80', me); toast('Number saved'); load(); }
    catch(e){ $('#err').textContent = e.message; }
  };
  $('#saveph').onclick = save;
  $('#ph').onkeydown = e => { if (e.key === 'Enter') save(); };
  $('#cancelph').onclick = () => forced ? logout() : render();
  $('#ph').focus();
}

/* ---------- forgot PIN: text a one-time link ---------- */
function renderForgot(){
  let pick = null;
  $('#who').innerHTML = '';
  $('#app').innerHTML = `
    <div class="pinbox">
      <div class="label">Forgot PIN</div>
      <p>Tap your name and enter your mobile number. We'll text you a link to choose a new PIN.</p>
      <div class="names">${S.members.map(m=>`<button data-n="${esc(m.name)}"><span class="sw" style="background:${m.color}"></span>${esc(m.name)}</button>`).join('')}</div>
      <input class="pin tel" id="fph" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="07…">
      <button class="primary" id="fsend" style="width:240px">Text me a link</button>
      <div class="err" id="err"></div>
      <button class="viewonly" id="fback">Back</button>
    </div>`;
  document.querySelectorAll('.names button').forEach(b => b.onclick = () => {
    document.querySelectorAll('.names button').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); pick = b.dataset.n; $('#fph').focus();
  });
  $('#fback').onclick = () => render();
  $('#fsend').onclick = async () => {
    if (!pick) return $('#err').textContent = 'Tap your name first';
    try{
      const r = await api('forgot_pin', {name:pick, phone:$('#fph').value});
      document.querySelector('.pinbox').innerHTML = `
        <div class="label">Check your texts</div>
        <p>If that's ${esc(pick)}'s number, a text is on its way. The link works once, for 15 minutes.</p>
        ${r.demoLink ? `<p><a href="${r.demoLink}" style="color:var(--lime)">TEST VERSION: open the link the text would contain</a></p>` : ''}
        <button class="viewonly" id="fback">Back to log in</button>`;
      $('#fback').onclick = () => render();
    }catch(e){ $('#err').textContent = e.message; }
  };
}

/* ---------- arrived from the reset text ---------- */
function clearReset(){ resetTok = null; try{ history.replaceState(null, '', location.pathname); }catch(e){} }
function renderReset(){
  $('#who').innerHTML = '';
  $('#app').innerHTML = `
    <div class="pinbox">
      <div class="label">Choose a new PIN</div>
      <p>4 to 8 numbers.</p>
      <input class="pin" id="rp1" type="password" inputmode="numeric" autocomplete="new-password" maxlength="8" placeholder="NEW PIN">
      <input class="pin" id="rp2" type="password" inputmode="numeric" autocomplete="new-password" maxlength="8" placeholder="AGAIN">
      <button class="primary" id="rsave" style="width:220px">Save PIN</button>
      <div class="err" id="err"></div>
      <button class="viewonly" id="rback">Back to log in</button>
    </div>`;
  const save = async () => {
    if ($('#rp1').value !== $('#rp2').value) return $('#err').textContent = "PINs don't match";
    try{ me = await api('reset_pin', {reset:resetTok, pin:$('#rp1').value}); store('bac80', me); clearReset(); toast('PIN saved'); load(); }
    catch(e){ $('#err').textContent = e.message; }
  };
  $('#rsave').onclick = save;
  $('#rp2').onkeydown = e => { if (e.key === 'Enter') save(); };
  $('#rback').onclick = () => { clearReset(); render(); };
  $('#rp1').focus();
}

function logout(){ me = null; viewOnly = false; store('bac80', null); S.avail = {}; S.events = []; closeSheet(); load(); }

/* ---------- main render ---------- */
function render(){
  $('#band').textContent = S.band || '80s-ish';
  $('#sub').textContent = viewOnly ? 'Gigs' : 'Rehearsal Calendar';
  if (resetTok) return renderReset();
  if (!me && !viewOnly) return renderLogin();
  if (me && me.mustChange) return renderChangePin(true);
  if (me && me.needPhone && !me.viewer) return renderPhone(true);

  $('#who').innerHTML = !me
    ? `Gig listings<button id="lo">Band sign in</button>`
    : me.viewer
    ? `Viewing as <b>${esc(me.name)}</b><span class="badge">View only</span><button id="lo">Log out</button>`
    : `Signed in as <b>${esc(me.name)}</b>${isAdmin()?'<span class="badge">Admin</span>':''}<button id="lo">Switch</button>`;
  $('#lo').onclick = logout;

  const y = view.getFullYear(), m = view.getMonth();
  const first = new Date(y, m, 1);
  const offset = (first.getDay() + 6) % 7;          // Monday first
  const days = new Date(y, m+1, 0).getDate();
  const tk = todayKey();

  // Triangle grid: 7 per row, alternating point-up / point-down so they tessellate.
  const rows = Math.ceil((offset + days) / 7);
  const head = ['M','T','W','T','F','S','S'].map((d,c)=>`<span class="dow" style="left:${c*12.5+12.5}%">${d}</span>`).join('');
  let cells = '';
  for (let d=1; d<=days; d++){
    const k = ymd(new Date(y,m,d));
    const idx = offset + d - 1, r = Math.floor(idx/7), c = idx % 7;
    const up = (r + c) % 2 === 0;
    const evs = eventsOn(k);
    const full = !viewOnly && allFree(k);
    const cls = ['day', up?'up':'dn', (k<tk && !evs.length)?'past':'', full?'full':''].join(' ');
    cells += `<button class="${cls}" style="left:${c*12.5}%;top:${(r*100/rows).toFixed(4)}%;height:${(100/rows).toFixed(4)}%" data-k="${k}" aria-label="${fmtLong(k)}">${triSVG(k, d, up, evs, k===tk, full)}</button>`;
  }

  $('#app').innerHTML = `
    ${viewOnly ? '' : `<div class="legend">
      ${S.members.map(mm=>`<span><i class="sw" style="background:${mm.color}"></i>${esc(mm.name)}</span>`).join('')}
    </div>`}
    <div class="monthbar">
      <button class="nav" id="prev" aria-label="Previous month">‹</button>
      <h2>${first.toLocaleDateString('en-GB',{month:'long', year:'numeric'})}</h2>
      <button class="nav" id="next" aria-label="Next month">›</button>
    </div>
    <div class="tools">
      ${canMark() ? `<button class="toggle ${quick?'on':''}" id="quick"><span class="pill"></span>Quick mark</button>` : '<span></span>'}
      <button class="todaybtn" id="today">Today</button>
    </div>
    ${canMark() && quick ? `<div style="font-size:19px;color:var(--dim);margin:-2px 3px 8px">Tap days to switch yourself on and off</div>` : ''}
    <div class="dows">${head}</div>
    <div class="tgrid" id="grid" style="aspect-ratio:4/${(rows*0.866).toFixed(3)}">${cells}</div>
    ${upcoming()}
    ${canMark() ? `<section class="card"><h3>Alerts</h3><div class="alertbox" id="pushBox">…</div>
      <button class="linkbtn" id="chgpin">Change my PIN</button> &nbsp; <button class="linkbtn" id="chgph">Change my mobile number</button></section>` : ''}
  `;
  if (canMark()){ renderPush(); $('#chgpin').onclick = () => renderChangePin(false); $('#chgph').onclick = () => renderPhone(false); }

  $('#prev').onclick = () => shift(-1);
  $('#next').onclick = () => shift(1);
  $('#today').onclick = () => { view = new Date(); view.setDate(1); render(); };
  if ($('#quick')) $('#quick').onclick = () => { quick = !quick; render(); };
  document.querySelectorAll('.day[data-k]').forEach(b => b.onclick = () => {
    if (canMark() && quick) cycle(b.dataset.k); else openDay(b.dataset.k);
  });
  document.querySelectorAll('[data-open]').forEach(li => li.onclick = () => openDay(li.dataset.open));
  swipe($('#grid'));
}

function upcoming(){
  const tk = todayKey();
  const evs = S.events.filter(e=>e.date>=tk).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,8);
  const booked = new Set(S.events.filter(e=>e.type!=='other').map(e=>e.date));
  const free = [];
  for (let i=0, d=new Date(); i<120 && free.length<6; i++, d.setDate(d.getDate()+1)){
    const k = ymd(d); if (allFree(k) && !booked.has(k)) free.push(k);
  }
  return `
    <section class="card"><h3>${viewOnly ? 'Upcoming Gigs' : 'Coming Up'}</h3>
      ${evs.length ? `<ul class="list">${evs.map(e=>`
        <li data-open="${e.date}"><span class="d">${fmtShort(e.date)}</span>
          <span class="t"><span class="tag ${e.type}">${TYPES[e.type]}</span> ${esc(e.title)}
          ${e.time||e.place?`<div class="m">${esc([e.time,e.place].filter(Boolean).join(' · '))}</div>`:''}</span></li>`).join('')}</ul>`
        : `<div class="empty">${viewOnly ? 'No gigs announced yet.' : 'Nothing booked yet.'}</div>`}
    </section>
    ${viewOnly ? '' : `<section class="card"><h3>Everyone Free</h3>
      ${free.length ? `<ul class="list">${free.map(k=>`<li data-open="${k}"><span class="d">${fmtShort(k)}</span><span class="t m">All five available</span></li>`).join('')}</ul>`
        : `<div class="empty">No dates where all five are free yet.</div>`}
    </section>`}`;
}

function shift(n){ view.setMonth(view.getMonth()+n); render(); }

function swipe(el){
  let x0=null, y0=null;
  el.addEventListener('touchstart', e=>{ x0=e.touches[0].clientX; y0=e.touches[0].clientY; }, {passive:true});
  el.addEventListener('touchend', e=>{
    if (x0===null) return;
    const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
    if (Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5) shift(dx<0?1:-1);
    x0=null;
  }, {passive:true});
}

/* ---------- availability ---------- */
async function setAvail(k, status){
  const prev = (S.avail[k]||{})[me.name] ?? null;
  S.avail[k] = S.avail[k] || {};
  if (status === null) delete S.avail[k][me.name]; else S.avail[k][me.name] = status;
  render(); if (openKey) openDay(openKey, true);
  try{ S = await api('avail', {token:me.token, date:k, status}); render(); if (openKey) openDay(openKey, true); }
  catch(e){
    if (prev===null) delete S.avail[k][me.name]; else S.avail[k][me.name]=prev;
    render(); toast(e.message);
  }
}
function cycle(k){
  const cur = (S.avail[k]||{})[me.name];
  setAvail(k, cur==='y' ? null : 'y');
}

/* ---------- day sheet ---------- */
function openDay(k, refresh){
  openKey = k;
  const a = S.avail[k] || {};
  const mine = canMark() ? a[me.name] : null;
  const evs = eventsOn(k);
  const yes = S.members.filter(m=>a[m.name]==='y').length;

  $('#sheetBody').innerHTML = `
    <h2>${fmtLong(k)}</h2>
    ${viewOnly ? (evs.length ? '' : '<div style="color:var(--dim)">No gig on this date.</div>') : `<div style="color:var(--dim)">${allFree(k) ? '<span style="color:#fff">Everyone is free</span>' : `${yes} of ${S.members.length} available`}</div>`}

    ${canMark() ? `
      <div class="label">You — ${esc(me.name)}</div>
      <div class="choice" style="grid-template-columns:1fr">
        <button class="yes ${mine==='y'?'sel':''}" data-s="${mine==='y'?'':'y'}">${mine==='y'?'✓ I\'m available':'Mark me available'}</button>
      </div>
      ${mine==='y' ? `<div style="color:var(--dim);font-size:19px;margin-top:10px">Tap again to take it back.</div>` : ''}` : ''}

    ${viewOnly ? '' : '<div class="label">The band</div>'}
    ${S.members.map(m=>{
      const s=a[m.name];
      return `<div class="mem"><span class="sw" style="background:${m.color}"></span><span class="nm">${esc(m.name)}</span>
        <span class="st ${s==='y'?'y':'u'}">${s==='y'?'Available':'Not yet'}</span></div>`;
    }).join('')}

    ${evs.length ? `<div class="label">${viewOnly ? 'Gig' : 'Booked'}</div>${evs.map(e=>`
      <div class="evcard ${e.type}"><div class="row">
        <span><span class="tag ${e.type}">${TYPES[e.type]}</span> <span class="ttl">${esc(e.title)}</span></span>
        ${isAdmin()?`<button class="del" data-del="${e.id}">Delete</button>`:''}</div>
        ${e.time||e.place?`<div class="meta">${esc([e.time,e.place].filter(Boolean).join(' · '))}</div>`:''}
        ${e.notes?`<div class="notes">${esc(e.notes)}</div>`:''}
      </div>`).join('')}` : ''}

    ${isAdmin() ? `
      <div class="label">Add to this date</div>
      <form class="add" id="addForm">
        <div class="types">${Object.keys(TYPES).map(t=>`<button type="button" class="${t} ${t===newType?'sel':''}" data-t="${t}">${TYPES[t]}</button>`).join('')}</div>
        <input name="title" placeholder="${newType==='gig'?'e.g. The Railway Tavern':newType==='rehearsal'?'e.g. Full band run-through':'e.g. Bobs away'}" maxlength="80">
        <div class="two"><input name="time" placeholder="Time, e.g. 7–10pm" maxlength="20"><input name="place" placeholder="${newType==='rehearsal'?'The Room, Hither Green':'Venue / place'}" maxlength="80"></div>
        <textarea name="notes" rows="2" placeholder="Notes (setlist, kit, cost…)" maxlength="400"></textarea>
        <button class="primary" type="submit">Add ${TYPES[newType]}</button>
      </form>` : ''}
  `;

  document.querySelectorAll('#sheetBody [data-s]').forEach(b => b.onclick = () => setAvail(k, b.dataset.s || null));
  document.querySelectorAll('#sheetBody [data-del]').forEach(b => b.onclick = async () => {
    if (b.dataset.armed){ try{ S = await api('event_del',{token:me.token,id:b.dataset.del}); render(); openDay(k,true); toast('Deleted'); }catch(e){ toast(e.message); } }
    else { b.dataset.armed=1; b.textContent='Tap to confirm'; setTimeout(()=>{ if(b.isConnected){ delete b.dataset.armed; b.textContent='Delete'; } },3000); }
  });
  document.querySelectorAll('#sheetBody [data-t]').forEach(b => b.onclick = () => { newType=b.dataset.t; openDay(k,true); });
  const f = $('#addForm');
  if (f) f.onsubmit = async ev => {
    ev.preventDefault();
    const fd = new FormData(f);
    const e = {date:k, type:newType, title:fd.get('title'), time:fd.get('time'), place:fd.get('place'), notes:fd.get('notes')};
    if (!e.title.trim()) e.title = TYPES[newType];
    try{ S = await api('event_add',{token:me.token, event:e}); render(); openDay(k,true); toast(`${TYPES[newType]} added`); }
    catch(err){ toast(err.message); }
  };

  if (!refresh){ $('#scrim').classList.add('show'); $('#sheet').classList.add('show'); $('#sheet').scrollTop=0; }
}
function closeSheet(){ openKey=null; $('#scrim').classList.remove('show'); $('#sheet').classList.remove('show'); }
$('#scrim').onclick = closeSheet;
$('#closeSheet').onclick = closeSheet;
document.addEventListener('keydown', e => { if (e.key==='Escape') closeSheet(); });

/* ---------- triangles ---------- */
// Six equal slices from the centre to the 3 corners and 3 edge midpoints. Corners and midpoints are
// shared with neighbouring days, so lines meet, and slots are arranged so each person's colour
// carries straight on into the next day. Slot order is the member order in config.php.
const TH = 86.6, DIM = .22;
const UP_SLOT = {LB:0, LT:1, RT:2, RB:3, BR:4, BL:'date'};
const DN_SLOT = {LT:UP_SLOT.RT, LB:UP_SLOT.RB, RT:UP_SLOT.LT, RB:UP_SLOT.LB, TL:UP_SLOT.BL, TR:UP_SLOT.BR};
const pts = a => a.map(p=>p[0].toFixed(2)+','+p[1].toFixed(2)).join(' ');
function slices(up){
  if (up){ const A=[50,0],R=[100,TH],L=[0,TH],G=[50,2*TH/3],mR=[75,TH/2],mB=[50,TH],mL=[25,TH/2];
    return {G, map:UP_SLOT, s:{RT:[G,A,mR],RB:[G,mR,R],BR:[G,R,mB],BL:[G,mB,L],LB:[G,L,mL],LT:[G,mL,A]}}; }
  const TL=[0,0],TR=[100,0],B=[50,TH],G=[50,TH/3],mT=[50,0],mR=[75,TH/2],mL=[25,TH/2];
  return {G, map:DN_SLOT, s:{TL:[G,TL,mT],TR:[G,mT,TR],RT:[G,TR,mR],RB:[G,mR,B],LB:[G,B,mL],LT:[G,mL,TL]}};
}
function triSVG(k, d, up, evs, today, full){
  const a = S.avail[k] || {}, {G, s, map} = slices(up);
  let g = '', ds = null;
  for (const key in s){
    const slot = map[key];
    if (slot === 'date'){ ds = s[key]; g += `<polygon points="${pts(s[key])}" fill="${today?'#fff':'#000'}"/>`; continue; }
    const m = S.members[slot];
    if (viewOnly || !m){ g += `<polygon points="${pts(s[key])}" fill="#161616"/>`; continue; }
    g += `<polygon data-slot="${slot}" points="${pts(s[key])}" fill="${m.color}" fill-opacity="${a[m.name]==='y'?1:DIM}"/>`;
  }
  const outline = up ? [[50,0],[100,TH],[0,TH]] : [[0,0],[100,0],[50,TH]];
  g += `<polygon points="${pts(outline)}" fill="none" stroke="#fff" stroke-width="${full?4:1.4}" stroke-linejoin="round"/>`;
  const cx=(ds[0][0]+ds[1][0]+ds[2][0])/3, cy=(ds[0][1]+ds[1][1]+ds[2][1])/3;
  g += `<text class="tnum" x="${cx}" y="${cy+1}" font-size="10" fill="${today?'#000':'#fff'}" stroke="${today?'#fff':'#000'}">${d}</text>`;
  if (evs.length){
    const TAG = {rehearsal:'REH', gig:'GIG', other:'NB'}, t = TAG[evs[0].type] + (evs.length>1?'+':'');
    g += `<rect x="${G[0]+2}" y="${G[1]-6}" width="${t.length*6.5+7}" height="12" fill="#000" stroke="#fff" stroke-width="1"/><text class="ttag" x="${G[0]+5.5+t.length*3.25}" y="${G[1]+.5}">${t}</text>`;
  }
  return `<svg viewBox="0 0 100 ${TH}" preserveAspectRatio="none" aria-hidden="true">${g}</svg>`;
}
// Days where everyone is free: colours spin continuously, like fruit-machine reels
let spinTick = 0;
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) setInterval(() => {
  spinTick++;
  document.querySelectorAll('.day.full polygon[data-slot]').forEach(pg => {
    const m = S.members[(+pg.dataset.slot + spinTick) % S.members.length];
    if (m){ pg.setAttribute('fill', m.color); pg.setAttribute('fill-opacity', 1); }
  });
}, 85);

/* ---------- alerts (web push) ---------- */
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
let pushSynced = false;
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(()=>{});
function b64uBytes(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); s+='='.repeat((4-s.length%4)%4); return Uint8Array.from(atob(s), c=>c.charCodeAt(0)); }
async function renderPush(){
  const box = $('#pushBox'); if (!box) return;
  const say = h => { if ($('#pushBox')) $('#pushBox').innerHTML = h; };
  if (isIOS && !standalone) return say('To get alerts when everyone is free: tap <b>Share</b> → <b>Add to Home Screen</b>, then open 80s-ish from your home screen and come back here.');
  if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) return say("This browser can't do notifications.");
  if (Notification.permission === 'denied') return say("Notifications are blocked for this app. Turn them on in your phone's settings, then reopen.");
  let sub = null;
  try{ const reg = await navigator.serviceWorker.getRegistration(); sub = reg ? await reg.pushManager.getSubscription() : null; }catch(e){}
  if (sub && Notification.permission === 'granted'){
    if (!pushSynced){ pushSynced = true; api('push_sub', {token:me.token, sub:sub.toJSON()}).catch(()=>{}); }
    say('✓ Alerts are on for this phone. You\'ll get one when all five are free on a day.<button class="primary" id="ptest">Send me a test</button>');
    $('#ptest').onclick = async () => { try{ const r = await api('push_test', {token:me.token}); toast(r.sent ? 'Test sent' : 'Not delivered — try turning alerts on again'); }catch(e){ toast(e.message); } };
    return;
  }
  say('Get an alert when all five of you are free on a day.<button class="primary" id="pon">Turn on alerts</button>');
  $('#pon').onclick = enablePush;
}
async function enablePush(){
  try{
    const perm = await Notification.requestPermission();      // must be the first thing after the tap (iPhone)
    if (perm !== 'granted'){ toast('Alerts not allowed'); return renderPush(); }
    const reg = await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    const {key} = await api('push_key');
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64uBytes(key)});
    await api('push_sub', {token:me.token, sub:sub.toJSON()});
    pushSynced = true; toast('Alerts on'); renderPush();
  }catch(e){ toast(e.message || "Couldn't turn on alerts"); renderPush(); }
}

/* ---------- live-ish updates ---------- */
setInterval(() => { if (!document.hidden && !document.activeElement.matches('input,textarea')) load(); }, 20000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });

load();
</script>
